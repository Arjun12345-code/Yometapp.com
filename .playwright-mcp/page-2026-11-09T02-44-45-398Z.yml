                  - article [ref=f14e286]:
                    - heading "Agency Commission" [level=3] [ref=f14e292]
                    - paragraph [ref=f14e293]: Earn commission based on weekly Beans revenue generated by hosts and sub-agents. The commission rates range from 5% to 36% and are updated weekly.
                - listitem [ref=f14e294]:
                  - article [ref=f14e295]:
                    - heading "Sub-Agency Commission" [level=3] [ref=f14e301]
                    - paragraph [ref=f14e302]:
                      - text: "Earn extra by inviting sub agents. The formula for sub-agency commission:"
                      - code [ref=f14e303]: (Your daily ratio − sub-agent daily ratio) × sub-agent daily revenue
