                - listitem [ref=f14e190]:
                  - article [ref=f14e191]:
                    - heading "Daily Task Rewards" [level=3] [ref=f14e197]
                    - paragraph [ref=f14e198]: Eligible hosts can receive 5,000 to 100,000 Beans based on their assigned level. Rewards depend on gift income, live hours, and call targets.
                - listitem [ref=f14e199]:
                  - article [ref=f14e200]:
                    - heading "Virtual Gifts and Video Calls" [level=3] [ref=f14e205]
                    - paragraph [ref=f14e206]: Connect with viewers through livestreams and video calls. Virtual gifts and calls are the main ways you can earn as a host on Yomet.
                - listitem [ref=f14e207]:
                  - article [ref=f14e208]:
                    - heading "Events and Global Audience" [level=3] [ref=f14e213]
                    - paragraph [ref=f14e214]: Yomet offers exclusive events and connects hosts with audiences in different countries with its real-time translation features.
