            - list [ref=f42e259]:
              - listitem [ref=f42e260]:
                - article [ref=f42e261]:
                  - heading "Agency Commission" [level=3] [ref=f42e267]
                  - paragraph [ref=f42e268]: Earn commission based on weekly Beans revenue generated by hosts and sub-agents. The commission rates range from 5% to 36% and are updated weekly.
              - listitem [ref=f42e269]:
                - article [ref=f42e270]:
                  - heading "Sub-Agency Commission" [level=3] [ref=f42e276]
                  - paragraph [ref=f42e277]:
                    - text: "Earn extra by inviting sub agents. The formula for sub-agency commission:"
                    - code [ref=f42e278]: (Your daily ratio − sub-agent daily ratio) × sub-agent daily revenue
              - listitem [ref=f42e279]:
                - article [ref=f42e280]:
                  - heading "Agency Benefits" [level=3] [ref=f42e284]
                  - list [ref=f42e285]:
                    - listitem [ref=f42e286]:
                      - strong [ref=f42e287]: "Video Room Agency:"
                      - text: Focuses on video calls and calling features, with free-call opportunities and better exposure in the live video section.
                    - listitem [ref=f42e288]:
                      - strong [ref=f42e289]: "Party Room Agency:"
                      - text: Focuses on party rooms, with extra rewards from party-room gifts and an additional 30% regular gift share.
