            - list [ref=f42e164]:
              - listitem [ref=f42e165]:
                - article [ref=f42e166]:
                  - heading "Daily Task Rewards" [level=3] [ref=f42e172]
                  - paragraph [ref=f42e173]: Eligible hosts can receive 5,000 to 100,000 Beans based on their assigned level. Rewards depend on gift income, live hours, and call targets.
              - listitem [ref=f42e174]:
                - article [ref=f42e175]:
                  - heading "Virtual Gifts and Video Calls" [level=3] [ref=f42e180]
                  - paragraph [ref=f42e181]: Connect with viewers through livestreams and video calls. Virtual gifts and calls are the main ways you can earn as a host on Yomet.
              - listitem [ref=f42e182]:
                - article [ref=f42e183]:
                  - heading "Events and Global Audience" [level=3] [ref=f42e188]
                  - paragraph [ref=f42e189]: Yomet offers exclusive events and connects hosts with audiences in different countries with its real-time translation features.
