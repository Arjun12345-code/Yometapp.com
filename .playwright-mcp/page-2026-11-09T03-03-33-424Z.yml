            - heading "Yomet Live Host Rules" [level=2] [ref=f42e220]
            - list [ref=f42e221]:
              - listitem [ref=f42e222]:
                - generic [ref=f42e228]: Hosts must not register or operate multiple accounts.
              - listitem [ref=f42e229]:
                - generic [ref=f42e235]: Hosts must not show pornographic or explicit content during public livestreams.
              - listitem [ref=f42e236]:
                - generic [ref=f42e242]: Hosts must not transfer their account to another agent.
              - listitem [ref=f42e243]:
                - generic [ref=f42e249]: Agents must not persuade a host to create an independent Yomet agency.
              - listitem [ref=f42e250]:
                - generic [ref=f42e254]: Hosts must be at least 18 years old to stream on the platform.
        - region [ref=f42e255]:
