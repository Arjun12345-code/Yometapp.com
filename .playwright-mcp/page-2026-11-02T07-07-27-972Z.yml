          - heading "Yomet Host Rules" [level=2] [ref=f39e233]
          - paragraph [ref=f39e234]: These rules and requirements apply to all Yomet hosts, whether you are new to livestreaming or already have experience as a live host.
        - generic [ref=f39e235]:
          - generic [ref=f39e236]:
            - generic [ref=f39e237]: "1"
            - paragraph [ref=f39e238]: Hosts are strictly prohibited from registering or operating multiple accounts.
          - generic [ref=f39e239]:
            - generic [ref=f39e240]: "2"
            - paragraph [ref=f39e241]: Hosts must not showcase pornographic or explicit content during public live broadcasts. According to the original policy, this restriction does not apply to private video calls.
          - generic [ref=f39e242]:
            - generic [ref=f39e243]: "3"
            - paragraph [ref=f39e244]: Hosts must not transfer their account to another agent. Agents must also not persuade a host to create an independent Yomet agency.
          - generic [ref=f39e245]:
            - generic [ref=f39e246]: "4"
            - paragraph [ref=f39e247]: All Yomet hosts must be 18 years old or older to work on the platform.
      - generic [ref=f39e249]:
        - heading "Frequently Asked Questions" [level=2] [ref=f39e251]
        - generic [ref=f39e252]:
          - generic [ref=f39e253]:
            - button "1. How can I register as a Yomet Live Host?" [ref=f39e254] [cursor=pointer]:
              - generic [aria-hidden]: ▼
            - generic: Download the Yomet app from the Google Play Store, then create an account using your Google account or phone number. Complete the verification and profile setup steps to finish your registration.
          - generic [ref=f39e257]:
            - button "2. Do I need to verify my phone number when registering?" [ref=f39e258] [cursor=pointer]:
              - generic [aria-hidden]: ▼
            - generic: Yes. If you register using your phone number, Yomet will send an OTP verification code to your device. Enter the code to verify your account.
          - generic [ref=f39e261]:
            - button "3. How do Yomet Host Daily Task Rewards work?" [ref=f39e262] [cursor=pointer]:
              - generic [aria-hidden]: ▼
            - generic: Yomet provides daily rewards for top-performing hosts who complete specific performance targets. Your reward level is based on your previous week's income, with requirements for gift income, live hours, and total calls. You must complete all required tasks and receive approval before earning the reward.
          - generic [ref=f39e265]:
            - button "4. How much can I earn from Daily Task Rewards?" [ref=f39e266] [cursor=pointer]:
              - generic [aria-hidden]: ▼
            - generic: Hosts can receive from 5,000 Beans at Level 1 up to 100,000 Beans at Level 7. The reward depends on your assigned level and whether you complete all required gift income, live hour, and call targets.
          - generic [ref=f39e269]:
            - button "5. What are the rules for Yomet Live Hosts?" [ref=f39e270] [cursor=pointer]:
              - generic [aria-hidden]: ▼
            - generic: Yomet hosts must use only one account, follow the public livestream content policy, comply with agency rules, and be at least 18 years old to work on the platform.
